[extension]
id = "antigravity"
name = "Antigravity CLI"
version = "0.2.0"
node = ">=0.6,<1"
publisher = "aurelio"
summary = "Google's Antigravity CLI (agy): one headless run per wake, in an isolated home."

[harness]
binaries = ["agy"]
protocol = "agy-stream"
home_env = "HOME"
api_keys = ["GEMINI_API_KEY"]

[harness.install]
from = "updater"
url = "https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/{goplatform}.json"
asset = "antigravity"

[harness.sign_in]
how = "agy, once, in a terminal on the machine"
files = [".gemini/antigravity-cli/antigravity-oauth-token"]
# Shared by every machine, and stored again only when this changes: agy refreshes its access token
# about hourly and keeps the same refresh token.
key = "token.refresh_token"

[harness.run]
prompt = "arg"
args = ["-p", "{prompt}", "--output-format", "stream-json", "{session}", "{model}", "{permissions}", "{add_dirs}"]
resume = ["--conversation", "{value}"]
model = ["--model", "{value}"]
add_dir = ["--add-dir", "{value}"]

[harness.run.env]
AGY_CLI_DISABLE_AUTO_UPDATE = "true"
# agy's SSH-session check makes it keep its sign-in in the token file only. Without it, a token
# refresh writes to the OS keyring under the agent's home, where macOS has no keychain and shows
# a "Keychain Not Found" dialog on the machine's screen.
SSH_CONNECTION = "127.0.0.1 0 127.0.0.1 0"

[harness.run.permissions]
default = ["--dangerously-skip-permissions"]
auto = ["--dangerously-skip-permissions"]

[harness.instructions]
via = "file"
file = ".gemini/GEMINI.md"

[harness.mcp]
via = "config-file"
file = ".gemini/config/mcp_config.json"
key = "mcpServers"
rename = { url = "serverUrl" }
drop = ["type"]

[harness.limits]
words = ["resource_exhausted", "quota", "credits balance is too low", "rate limit", "too many requests", "usage limit"]
